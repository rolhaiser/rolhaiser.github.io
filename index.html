<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mi página personal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #5d6658; /* color de fondo general */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background-color: #ffffff; /* recuadro blanco */
      border: 3px solid #252525; /* borde negro */
      border-radius: 10px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    h1 {
      color: #2c3e50;
    }
    p {
      font-size: 18px;
      color: #555;
    }
    img {
      border-radius: 10px;
      margin-bottom: 20px;
    }
    footer {
      margin-top: 30px;
      font-size: 14px;
      color: #888;
    }

    /* Botón de descarga */
    .boton {
      display: block;
      padding: 12px 20px;
      background-color: #556B2F; /* verde oliva */
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.3s;
      margin: 10px auto;
    }
    .boton:hover {
      background-color: #6B8E23;
    }

    /* Botón de navegación */
    /* Botón de navegación */
.boton-navegar {
  display: block;
  padding: 12px 20px;
  background-color: #0047ab; /* azul cobalto */
  color: #f4f4f9;
  text-decoration: none;
  border-radius: 6px;
  font-weight: bold;
  border: 2px solid #272757; /* azul medianoche */
  transition: background 0.3s, color 0.3s;
  margin: 10px;
}
.boton-navegar:hover {
  background-color: #272757; /* se oscurece al pasar el mouse */
  color: white;
}
  </style>
</head>
<body>
  <div class="container">
    <img src="imagenes/autor.png" alt="Foto de Ivo" width="300">
    <h1>Hola, soy Ivo</h1>
    <p>Bienvenido a mi página.</p>

    <!-- Botón para navegar -->
    <a href="programacion/" class="boton-navegar">
      Ir a Programación
    </a>

    <footer>
      <p>© 2026 Ivo Rolhaiser</p>
    </footer>
  </div>
</body>
</html>
